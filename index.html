<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Digital - Mulheres Maranhenses (SLZ)</title>

 <link rel="stylesheet" href="css/style.css">

</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="header-bar"></div>
    <div class="header-content">
      <div class="header-title-container">
        <div class="header-star-badge">★</div>
        <div class="header-titles">
          <h1>Mapa Digital — Mulheres Maranhenses</h1>
          <p>Mapeando a história, a cultura e o protagonismo feminino na Ilha de São Luís</p>
        </div>
      </div>

      <div class="header-controls">
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">
          <span>🌙</span> Modo Escuro
        </button>

        <div class="header-stats">
          <div class="stat-pill stat-1">
            <span>15</span>
            <small>Históricas</small>
          </div>
          <div class="stat-pill stat-2">
            <span>20</span>
            <small>Na Cultura</small>
          </div>
          <div class="stat-pill stat-3">
            <span>15</span>
            <small>Contemporâneas</small>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="main-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="filter-section">
        <h3>Filtrar por Categoria</h3>
        <button class="filter-btn active" data-level="all" onclick="filterLevel('all')">Todas as Mulheres (50)</button>
        <button class="filter-btn" data-level="1" onclick="filterLevel('1')">1º Nível — Mulheres Históricas</button>
        <button class="filter-btn" data-level="2" onclick="filterLevel('2')">2º Nível — Mulheres na Cultura</button>
        <button class="filter-btn" data-level="3" onclick="filterLevel('3')">3º Nível — Mulheres Contemporâneas</button>
      </div>

      <div class="women-list" id="womenList">
        <!-- Gerado via JS -->
      </div>
    </div>

    <!-- Área do Mapa -->
    <div class="map-container">
      <div class="static-map-wrapper" id="mapWrapper">
        <div class="map-transform-container" id="mapTransform">
          <img class="map-bg" src="Gemini_Generated_Image_5e57yi5e57yi5e57.jpg" alt="Mapa de São Luís">
          <div class="pins-layer" id="pinsLayer"></div>
        </div>
        <div class="map-zoom-controls">
          <button class="zoom-btn" onclick="zoomIn()" title="Aproximar">+</button>
          <button class="zoom-btn" onclick="zoomOut()" title="Afastar">-</button>
          <button class="zoom-btn" onclick="resetZoom()" title="Redefinir Padrão" style="font-size: 0.8rem;">↺</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-header">
        <div class="modal-avatar-container" id="modalImgContainer">
          <img id="modalImg" src="" alt="Foto Perfil">
        </div>
        <div class="modal-header-info">
          <h2 id="modalName"></h2>
          <p id="modalPeriod"></p>
          <span id="modalBadge" class="badge"></span>
        </div>
      </div>
      <div class="modal-body">
        <div class="detail-group">
          <label>Área de Atuação</label>
          <p id="modalArea"></p>
        </div>
        <div class="detail-group">
          <label>O Impacto</label>
          <p id="modalImpact"></p>
        </div>
        <div class="detail-group">
          <label>Categoria e Subcategoria</label>
          <p id="modalCategory"></p>
        </div>
        <div class="detail-group">
          <label>Local de Representação em São Luís</label>
          <p id="modalLocation"></p>
        </div>
        <div class="detail-group">
          <label>Breve Biografia</label>
          <p id="modalBio"></p>
        </div>
      </div>
    </div>
  </div>

<script src="js/script.js"></script>

</body>
</html>
